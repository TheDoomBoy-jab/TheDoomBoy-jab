name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics.yml
      - scripts/patch_metrics.py

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out pinned Metrics implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dkhokhlov/metrics
          ref: ca58c6bb513e4a04afca0ad2e46b943b543f74cc
          path: .metrics-action
          persist-credentials: false

      - name: Remove unused Projects achievement and its permission requirement
        run: python3 scripts/patch_metrics.py .metrics-action

      - name: Generate separate 3D contribution calendar
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TheDoomBoy-jab
          filename: profile-calendar.png
          config_output: png
          config_timezone: Asia/Kolkata
          config_animations: no
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          output_action: commit
          committer_branch: main
          committer_message: "chore: update contribution calendar [skip ci]"

      - name: Generate profile metrics and achievements
        uses: ./.metrics-action
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TheDoomBoy-jab
          filename: profile-metrics.png
          config_output: png
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_animations: no
          plugins_errors_fatal: yes
          output_action: commit
          committer_branch: main
          committer_message: "chore: update profile metrics [skip ci]"

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

          plugin_stars: yes
          plugin_stars_limit: 4
